name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore FDINIZ_Lab.slnx

      - name: Build
        run: dotnet build FDINIZ_Lab.slnx --no-restore -c Release

      - name: Testes
        run: dotnet test FDINIZ_Lab.slnx --no-build -c Release --verbosity normal

      - name: Verificar pacotes com vulnerabilidade conhecida
        run: |
          dotnet list FDINIZ_Lab.slnx package --vulnerable --include-transitive 2>&1 | tee vulneraveis.txt
          if grep -q -i "has the following vulnerable packages" vulneraveis.txt; then
            echo "::error::Há pacotes com vulnerabilidade conhecida."
            exit 1
          fi
